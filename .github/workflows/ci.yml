name: Validate focused upstream PR

on:
  push:
    branches: [audit-owl2vowl-security]
    tags:
     - 'v*'
  pull_request:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  maven:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [11, 17, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c3bde3aa1aa9a55034846894333e5ef465f57114
      - uses: actions/checkout@v7
        with:
          ref: 126ae833223a8aecdc51a08e7b1b0c7de7634110
          path: audit-tools
          sparse-checkout: |
            /scripts/security/
            /src/test/java/diagram/DiagramGenerationTest.java
          sparse-checkout-cone-mode: false
      # details https://github.com/actions/setup-java
      - name: Set up JDK  ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          java-version:  ${{ matrix.jdk }}
          distribution: 'zulu'
          cache: maven
      - name: Build with Maven
        run: mvn -e --batch-mode verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=dependency-tree.txt
      - name: Run converter regression from the audit checkout
        run: |
          mkdir -p target/security/external-tests
          test_classpath="JAR/widoco-1.4.26-jar-with-dependencies.jar:$HOME/.m2/repository/junit/junit/4.13.2/junit-4.13.2.jar:$HOME/.m2/repository/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          javac --release 11 -cp "$test_classpath" -d target/security/external-tests audit-tools/src/test/java/diagram/DiagramGenerationTest.java
          java -cp "target/security/external-tests:$test_classpath" org.junit.runner.JUnitCore diagram.DiagramGenerationTest > target/security/external-diagram-test.txt
          cat target/security/external-diagram-test.txt
      - name: Check resolved dependencies and packaged bytecode
        run: |
          mkdir -p target/security
          git rev-parse HEAD > target/security/source-commit.txt
          node audit-tools/scripts/security/tree-inventory.mjs dependency-tree.txt target/security/resolved-artifacts.json
          python audit-tools/scripts/security/jar-inventory.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/jar.json --assert-clean
          python audit-tools/scripts/security/audit-packaged-classes.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/resolved-artifacts.json "$HOME/.m2/repository" target/security/bytecode-provenance.json
          node audit-tools/scripts/security/scan-osv.mjs target/security/resolved-artifacts.json target/security/resolved-osv.json --fail-on-vulnerability
          node audit-tools/scripts/security/scan-osv.mjs target/security/jar-artifacts.json target/security/jar-osv.json --fail-on-vulnerability
      - name: Include JDK in filename
        run: |
          FN=$(ls JAR/*.jar)
          mv ${FN} ${FN/.jar/_JDK-${{ matrix.jdk }}.jar}
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: widoco_JDK-${{ matrix.jdk }}
          path: |
            JAR/*.jar
            target/security/*.json
            target/security/source-commit.txt
            target/security/external-diagram-test.txt
  java-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c3bde3aa1aa9a55034846894333e5ef465f57114
      - uses: actions/checkout@v7
        with:
          ref: 126ae833223a8aecdc51a08e7b1b0c7de7634110
          path: audit-tools
          sparse-checkout: /scripts/security/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '11'
          cache: maven
      - run: mvn --batch-mode verify
      - name: Install checksum-verified Trivy 0.74.0
        run: |
          mkdir -p .trivy-tools
          cd .trivy-tools
          curl --fail --location --retry 3 --output trivy_0.74.0_Linux-64bit.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_linux-64bit.tar.gz
          curl --fail --location --retry 3 --output checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
      - name: Scan Java packages in the actual JAR and Maven manifests
        run: |
          mkdir -p target/security
          git rev-parse HEAD > target/security/source-commit.txt
          : > target/security/empty.trivyignore
          scan_args=(--cache-dir .trivy-cache --scanners vuln --detection-priority comprehensive --ignorefile target/security/empty.trivyignore --list-all-pkgs --no-progress --timeout 15m --format json)
          .trivy-tools/trivy rootfs "${scan_args[@]}" --output target/security/trivy-java-jar.json JAR/widoco-1.4.26-jar-with-dependencies.jar
          .trivy-tools/trivy fs "${scan_args[@]}" --output target/security/trivy-source.json .
          node audit-tools/scripts/security/summarize-trivy.mjs target/security/trivy-summary.json target/security/trivy-java-jar.json target/security/trivy-source.json
          node -e "const r=require('./target/security/trivy-java-jar.json'); if(!r.Results?.some(x=>x.Type==='jar'&&x.Packages?.length)) throw new Error('Trivy detected no Java packages');"
          .trivy-tools/trivy --cache-dir .trivy-cache --version > target/security/trivy-version.txt
          sha256sum JAR/widoco-1.4.26-jar-with-dependencies.jar > target/security/sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: widoco-java-security
          path: |
            JAR/widoco-1.4.26-jar-with-dependencies.jar
            target/security/*.json
            target/security/*.txt
  docker:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # https://github.com/docker/metadata-action (lower cases image name, etc.)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

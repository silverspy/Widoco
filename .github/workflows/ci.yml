name: CI

on:
  push:
    branches: [develop, master, replace-owl2vowl-with-teamdigitale-core]
    tags:
     - 'v*'
  pull_request:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  maven:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [11, 17, 21]
    steps:
      - uses: actions/checkout@v7
      # details https://github.com/actions/setup-java
      - name: Set up JDK  ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          java-version:  ${{ matrix.jdk }}
          distribution: 'zulu'
          cache: maven
      - name: Build with Maven
        run: mvn -e --batch-mode -f build-reactor/pom.xml verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=dependency-tree.txt
      - name: Audit dependencies and packaged bytecode without suppressions
        run: |
          mkdir -p target/security
          node scripts/security/tree-inventory.mjs dependency-tree.txt target/security/resolved-artifacts.json
          python scripts/security/jar-inventory.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/jar.json --assert-clean
          python scripts/security/audit-packaged-classes.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/resolved-artifacts.json "$HOME/.m2/repository" target/security/bytecode-provenance.json owl2vowl-core/target/owl2vowl-core-1.0.0-teamdigitale-5cdef094.jar
          node scripts/security/scan-osv.mjs target/security/resolved-artifacts.json target/security/resolved-osv.json --fail-on-vulnerability
          node scripts/security/scan-osv.mjs target/security/jar-artifacts.json target/security/jar-osv.json --fail-on-vulnerability
          python scripts/security/audit-frontend-jar.py JAR/widoco-1.4.26-jar-with-dependencies.jar src/main/resources target/security/frontend-jar.json target/security/frontend-assets
          node scripts/security/scan-frontend-osv.mjs scripts/security/frontend-components.json target/security/frontend-osv.json
      - name: Include JDK in filename
        run: |
          FN=$(ls JAR/*.jar)
          mv ${FN} ${FN/.jar/_JDK-${{ matrix.jdk }}.jar}
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: widoco_JDK-${{ matrix.jdk }}
          path: JAR/*.jar
  docker:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # https://github.com/docker/metadata-action (lower cases image name, etc.)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

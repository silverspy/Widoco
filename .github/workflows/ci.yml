name: CI

on:
  push:
    branches: [develop, master, replace-owl2vowl-with-teamdigitale-core]
    tags:
     - 'v*'
  pull_request:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  maven:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [11, 17, 21]
    steps:
      - uses: actions/checkout@v7
      # details https://github.com/actions/setup-java
      - name: Set up JDK  ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          java-version:  ${{ matrix.jdk }}
          distribution: 'zulu'
          cache: maven
      - name: Build with Maven
        run: mvn -e --batch-mode verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=dependency-tree.txt
      - name: Audit dependencies and packaged bytecode without suppressions
        run: |
          mkdir -p target/security
          node scripts/security/tree-inventory.mjs dependency-tree.txt target/security/resolved-artifacts.json
          python scripts/security/jar-inventory.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/jar.json --assert-clean
          python scripts/security/audit-packaged-classes.py JAR/widoco-1.4.26-jar-with-dependencies.jar target/security/resolved-artifacts.json "$HOME/.m2/repository" target/security/bytecode-provenance.json
          node scripts/security/scan-osv.mjs target/security/resolved-artifacts.json target/security/resolved-osv.json --fail-on-vulnerability
          node scripts/security/scan-osv.mjs target/security/jar-artifacts.json target/security/jar-osv.json --fail-on-vulnerability
          python scripts/security/audit-frontend-jar.py JAR/widoco-1.4.26-jar-with-dependencies.jar src/main/resources target/security/frontend-jar.json target/security/frontend-assets
          node scripts/security/scan-frontend-osv.mjs scripts/security/frontend-components.json target/security/frontend-osv.json
      - name: Include JDK in filename
        run: |
          FN=$(ls JAR/*.jar)
          mv ${FN} ${FN/.jar/_JDK-${{ matrix.jdk }}.jar}
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: widoco_JDK-${{ matrix.jdk }}
          path: JAR/*.jar
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: maven
      - name: Build and test WIDOCO with the published converter
        run: mvn --batch-mode verify
      - name: Install checksum-verified Trivy 0.74.0
        run: |
          mkdir -p .trivy-tools
          cd .trivy-tools
          curl --fail --location --retry 3 --output trivy_0.74.0_Linux-64bit.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_linux-64bit.tar.gz
          curl --fail --location --retry 3 --output checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
      - name: Scan the actual JAR, manifests and packaged frontend inventory
        shell: pwsh
        run: ./scripts/security/scan-trivy.ps1 -Trivy ./.trivy-tools/trivy -Cache .trivy-cache
      - name: Upload the scanned JAR and unfiltered reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widoco-trivy-audit
          path: |
            JAR/widoco-1.4.26-jar-with-dependencies.jar
            target/security/trivy/*.json
            target/security/trivy/*.txt
  docker:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # https://github.com/docker/metadata-action (lower cases image name, etc.)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
